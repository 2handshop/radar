<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xianyu Sneaker Hunter Pro Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #logBox::-webkit-scrollbar { width: 4px; }
        #logBox::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-3 md:p-6">

    <div class="max-w-7xl mx-auto space-y-4">
        <!-- Control Panel -->
        <div class="bg-slate-900 border border-slate-800 p-4 md:p-6 rounded-2xl shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">
                        ⚡ XIANYU SNEAKER HUNTER
                    </h1>
                    <p class="text-xs text-slate-400">Tự động dịch từ khóa sang tiếng Trung • Quy đổi 1¥ = 4,500đ</p>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                    <!-- Nút Bật/Tắt Tiền VNĐ -->
                    <button onclick="toggleCurrency()" id="currencyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-xl border border-slate-700 font-bold transition">
                        💱 Đổi sang VNĐ (ON)
                    </button>
                    <button onclick="clearMemory()" class="text-xs bg-rose-950/60 hover:bg-rose-900 text-rose-300 px-3 py-1.5 rounded-xl border border-rose-800/50 transition">
                        🗑️ Xóa Bot
                    </button>
                </div>
            </div>

            <!-- Bộ lọc tìm kiếm & Khung Copy Từ Khóa Trung -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 items-end">
                <div class="lg:col-span-2">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nhập tiếng Việt (Ví dụ: Giày Nike 2hand)</label>
                    <div class="flex gap-2">
                        <input type="text" id="keywordInput" oninput="autoTranslate()" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none transition" placeholder="Nhập từ khóa...">
                    </div>
                </div>

                <!-- Ô hiển thị tiếng Trung dịch tự động + Nút Copy -->
                <div class="lg:col-span-2">
                    <label class="block text-xs font-semibold text-amber-400 mb-1">Tiếng Trung (Copy dán vào app Xianyu nếu cần)</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="translatedInput" readonly class="w-full bg-slate-950 border border-amber-500/50 px-3 py-2 rounded-xl text-sm text-amber-300 outline-none font-mono" placeholder="Tự động dịch...">
                        <button onclick="copyTranslated()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap active:scale-95">
                            📋 Copy
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Giá thấp nhất (¥)</label>
                    <input type="number" id="minPrice" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none transition" value="80">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Giá cao nhất (¥)</label>
                    <input type="number" id="maxPrice" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none transition" value="650">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-800/80 items-center">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Trang quét (Page)</label>
                    <input type="number" id="pageNumber" min="1" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none transition" value="1">
                </div>
                <div>
                    <label class="flex items-center space-x-2 bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl cursor-pointer hover:border-amber-500 transition mt-5 sm:mt-0">
                        <input type="checkbox" id="onlyNewToggle" checked class="w-4 h-4 text-amber-500 rounded focus:ring-amber-500 bg-slate-800 border-slate-600">
                        <span class="text-xs text-amber-400 font-bold">Chỉ Hiện Bài Mới (Bot Monitor)</span>
                    </label>
                </div>
                <div>
                    <button id="startBtn" onclick="startScan()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-slate-950 font-extrabold py-2.5 px-4 rounded-xl text-sm transition shadow-lg active:scale-[0.98]">
                        🔍 Quét Deal Xianyu
                    </button>
                </div>
            </div>
        </div>

        <!-- Terminal -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 md:p-4 shadow-lg">
            <div id="logBox" class="h-28 overflow-y-auto text-xs font-mono space-y-1 text-slate-300">
                <div class="text-slate-500">[Hệ thống] Nhập tiếng Việt bất kỳ, hệ thống tự dịch sang tiếng Trung để quét...</div>
            </div>
        </div>

        <!-- Lưới kết quả -->
        <div>
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="text-base md:text-lg font-bold text-slate-200">Deal Săn Được (<span id="countText">0</span>)</h2>
                <span class="text-[11px] text-slate-400">Bộ nhớ Bot: <span id="memoryCount" class="text-amber-400 font-bold">0</span></span>
            </div>
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
        </div>
    </div>

    <!-- Modal Xem Ảnh -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="relative max-w-4xl max-h-[90vh] w-full flex flex-col items-center">
            <button onclick="closeModal()" class="absolute -top-10 right-0 text-slate-300 hover:text-white text-xl font-bold bg-slate-800/80 px-3 py-1 rounded-full">✕</button>
            <img id="modalImg" src="" alt="Zoom ảnh giày" class="max-w-full max-h-[80vh] object-contain rounded-lg border border-slate-700 shadow-2xl">
        </div>
    </div>

    <script>
        const API_KEY = "464b6ecde1mshef2e830fa1c29fep1d646ejsnd12195dcf2fa";
        const API_HOST = "xianyu-2taobao-goofish-api.p.rapidapi.com";
        const API_URL = "https://xianyu-2taobao-goofish-api.p.rapidapi.com/xianyu/search/v1";

        let isVND = true; // Mặc định hiển thị VNĐ

        // Bộ nhớ Bot
        let seenItems = JSON.parse(localStorage.getItem('xianyuMemory')) || [];
        document.getElementById('memoryCount').innerText = seenItems.length;

        function clearMemory() {
            if(confirm("Xóa bộ nhớ Bot?")) {
                seenItems = [];
                localStorage.setItem('xianyuMemory', JSON.stringify(seenItems));
                document.getElementById('memoryCount').innerText = 0;
                log("Đã reset bộ nhớ Bot!", "success");
            }
        }

        function toggleCurrency() {
            isVND = !isVND;
            const btn = document.getElementById('currencyBtn');
            btn.innerText = isVND ? "💱 Đổi sang VNĐ (ON)" : "💱 Đổi sang VNĐ (OFF)";
            btn.className = isVND 
                ? "text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-xl border border-slate-700 font-bold transition" 
                : "text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-3 py-1.5 rounded-xl border border-slate-700 transition";
            
            // Render lại giá nếu đang có kết quả trên màn hình
            if(window.lastItemsData) {
                renderProducts(window.lastItemsData);
            }
        }

        // Từ điển từ khóa thông minh (Việt -> Trung Giản Thể tối ưu săn giày 2hand)
        const dict = {
            "giày": "鞋", "nike": "Nike", "adidas": "Adidas", "new balance": "New Balance", 
            "nb": "NB", "mizuno": "美津浓", "asics": "亚瑟士", "yeezy": "椰子", 
            "onitsuka tiger": "鬼冢虎", "cũ": "二手", "2hand": "二手", "thanh lý": "个人闲置",
            "chính hãng": "正品", "nam": "男", "nữ": "女", "đỏ": "红", "trắng": "白", "đen": "黑"
        };

        function autoTranslate() {
            let input = document.getElementById('keywordInput').value.toLowerCase().trim();
            if(!input) {
                document.getElementById('translatedInput').value = "";
                return;
            }
            
            let translated = input;
            // Thay thế các từ khóa tiếng Việt có trong từ điển sang Trung/Anh chuẩn
            for (let [vi, cn] of Object.entries(dict)) {
                let regex = new RegExp(vi, 'gi');
                translated = translated.replace(regex, cn);
            }
            document.getElementById('translatedInput').value = translated;
        }

        function copyTranslated() {
            const copyText = document.getElementById('translatedInput');
            if(!copyText.value) return alert("Chưa có chữ để copy!");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Đã copy từ khóa tiếng Trung: " + copyText.value);
        }

        const BLACKLIST = [
            "全码", "齐码", "多码", "断码", "情侣款", "鞋码齐全", "男女鞋", "各种码", "都有",
            "全新", "代购", "专柜", "实体店", "清仓", "代理", "一件代发", "批发", 
            "莆田", "纯原", "公司级", "高仿", "厂货", "尾单", "复刻", "定制", "假", 
            "顶级", "超a", "过验", "1:1", "原单", "原厂", "原盒", "支持验货", "放店", 
            "微商", "店主", "进货渠道", "正品保真"
        ];

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            let color = "text-slate-300";
            if (type === 'error') color = "text-rose-400 font-semibold";
            if (type === 'warn') color = "text-amber-400";
            if (type === 'success') color = "text-emerald-400 font-semibold";
            div.className = color;
            div.innerHTML = `<span class="text-slate-600">[${time}]</span> ${message}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function openImage(url) { modalImg.src = url; imageModal.classList.remove('hidden'); }
        function closeModal() { imageModal.classList.add('hidden'); modalImg.src = ""; }
        imageModal.onclick = (e) => { if (e.target === imageModal) closeModal(); };
        document.addEventListener('keydown', (e) => { if (e.key === "Escape") closeModal(); });

        function checkBlacklist(text) {
            if (!text) return null;
            for (let word of BLACKLIST) {
                if (text.includes(word)) return word; 
            }
            return null;
        }

        async function startScan() {
            // Lấy từ khóa tiếng Trung đã dịch tự động
            const keyword = document.getElementById('translatedInput').value.trim() || document.getElementById('keywordInput').value.trim();
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 999999;
            const page = parseInt(document.getElementById('pageNumber').value) || 1;

            if (!keyword) return log("Vui lòng nhập từ khóa cần tìm!", "error");

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50');
            document.getElementById('productGrid').innerHTML = "";
            document.getElementById('countText').innerText = "0";

            log(`Đang quét với từ khóa Trung: "${keyword}" | Trang: ${page}`, "warn");

            try {
                const url = `${API_URL}?keyword=${encodeURIComponent(keyword)}&page=${page}`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-RapidAPI-Key': API_KEY, 'X-RapidAPI-Host': API_HOST, 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP Lỗi ${response.status}`);
                const result = await response.json();
                
                let items = [];
                if (result.data && Array.isArray(result.data.item)) items = result.data.item;
                else if (result.data && Array.isArray(result.data.items)) items = result.data.items;
                else if (result.items && Array.isArray(result.items)) items = result.items;
                else if (Array.isArray(result)) items = result;

                if (items.length === 0) {
                    log("Không tìm thấy kết quả.", "warn");
                    startBtn.disabled = false;
                    startBtn.classList.remove('opacity-50');
                    return;
                }

                window.lastItemsData = items; // Lưu lại để đổi tiền tệ nhanh
                renderProducts(items);

            } catch (err) {
                log(`Lỗi thực thi: ${err.message}`, "error");
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50');
            }
        }

        function renderProducts(items) {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = "";
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 999999;
            const isOnlyNew = document.getElementById('onlyNewToggle').checked;

            let validCount = 0, fakeCount = 0, oldSkipCount = 0;
            let newItemsFound = [];

            items.forEach(item => {
                const title = item.title || item.desc || "";
                const priceRMB = parseFloat(item.price || 0);
                const itemId = item.item_id || item.id || title; 

                const isNewDeal = !seenItems.includes(itemId);
                if (isOnlyNew && !isNewDeal) { oldSkipCount++; return; }
                if (checkBlacklist(title)) { fakeCount++; return; }
                if (priceRMB < minPrice || priceRMB > maxPrice) return;

                validCount++;
                if (isNewDeal) newItemsFound.push(itemId);

                const imgUrl = item.pic_url || item.pic || item.imageUrl || "https://placehold.co/400x400/1e293b/white?text=No+Image";
                const itemUrl = item.detail_url || item.item_url || (item.item_id ? `https://2.taobao.com/item.htm?id=${item.item_id}` : "#");

                // Quy đổi tiền tệ: 1 tệ = 4500 VNĐ
                let displayPriceText = `¥${priceRMB}`;
                if (isVND) {
                    let priceVND = priceRMB * 4500;
                    displayPriceText = priceVND.toLocaleString('vi-VN') + ' đ';
                }

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-slate-700 transition duration-200 flex flex-col group relative shadow-md";
                card.innerHTML = `
                    ${isNewDeal ? '<div class="absolute top-2 right-2 z-10 bg-rose-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-lg animate-pulse">🔥 MỚI</div>' : ''}
                    <div class="relative w-full aspect-square bg-slate-950 overflow-hidden cursor-pointer">
                        <img src="${imgUrl}" alt="Sneaker" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onclick="openImage('${imgUrl}')">
                    </div>
                    <div class="p-2.5 md:p-3 flex flex-col flex-grow justify-between">
                        <div><h3 class="text-xs text-slate-200 line-clamp-2 leading-tight font-medium" title="${title}">${title}</h3></div>
                        <div class="mt-2.5 pt-2 border-t border-slate-800 flex items-center justify-between">
                            <div><span class="text-sm md:text-base font-black text-amber-400 font-mono">${displayPriceText}</span></div>
                            <a href="${itemUrl}" target="_blank" class="bg-amber-400 hover:bg-amber-300 text-slate-950 text-[11px] font-bold px-2.5 py-1.5 rounded-lg transition active:scale-95">Mở App ➜</a>
                        </div>
                    </div>
                `;
                productGrid.appendChild(card);
            });

            if (newItemsFound.length > 0) {
                seenItems = [...newItemsFound, ...seenItems].slice(0, 2000);
                localStorage.setItem('xianyuMemory', JSON.stringify(seenItems));
                document.getElementById('memoryCount').innerText = seenItems.length;
            }

            document.getElementById('countText').innerText = validCount;
            log(`Lọc xong: Chặn ${fakeCount} rác | Ẩn ${oldSkipCount} cũ | Hiện ${validCount} deal!`, "success");

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50');
        }
    </script>
</body>
</html>
