<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Săn Deal Giày Xianyu (2Hand) - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Tùy chỉnh thanh cuộn UI */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        #logBox::-webkit-scrollbar-track { background: #1f2937; }
        #logBox::-webkit-scrollbar-thumb { background-color: #4b5563; }
        
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6 relative">
        
        <!-- Header & Bảng điều khiển -->
        <div class="glass-panel p-6 md:p-8 rounded-2xl shadow-lg border border-white/50">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">
                    <i class="fa-solid fa-shoe-prints mr-2 text-blue-600"></i>Xianyu Sneaker Hunter
                </h1>
                <span class="px-3 py-1 bg-gradient-to-r from-yellow-400 to-yellow-500 text-yellow-900 text-xs font-bold rounded-full shadow-sm">
                    PRO VERSION
                </span>
            </div>
            
            <!-- Từ khóa mặc định -->
            <div class="mb-5">
                <p class="text-sm font-semibold text-gray-600 mb-3"><i class="fa-solid fa-tags mr-1"></i>Từ khóa gợi ý nhanh:</p>
                <div class="flex flex-wrap gap-2" id="keywordChips">
                    <!-- JS sẽ render chip vào đây -->
                </div>
            </div>

            <!-- Form điều khiển -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                <div class="md:col-span-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Từ khóa tìm kiếm</label>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="keywordInput" class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="VD: giày jordan 1...">
                    </div>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Giá Min (¥)</label>
                    <input type="number" id="minPrice" class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" value="50">
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Giá Max (¥)</label>
                    <input type="number" id="maxPrice" class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" value="800">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Trang (Page)</label>
                    <input type="number" id="pageNum" class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" value="1" min="1">
                </div>

                <div class="md:col-span-2">
                    <button id="startBtn" onclick="startScan()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center transform active:scale-95">
                        <i class="fa-solid fa-rocket mr-2"></i> Quét ngay
                    </button>
                </div>
            </div>
        </div>

        <!-- Khung Log & Trạng thái -->
        <div class="bg-gray-900 rounded-2xl shadow-lg p-5 border border-gray-700">
            <div class="flex items-center justify-between mb-3 border-b border-gray-700 pb-2">
                <h3 class="text-gray-300 text-sm font-bold flex items-center">
                    <i class="fa-solid fa-terminal mr-2"></i>Terminal Tiến Trình
                </h3>
                <span id="statusBadge" class="text-xs px-3 py-1 bg-gray-800 border border-green-500/30 rounded-full text-green-400 font-mono shadow-[0_0_10px_rgba(74,222,128,0.2)]">
                    Sẵn sàng
                </span>
            </div>
            <div id="logBox" class="h-32 overflow-y-auto text-xs md:text-sm text-green-400 font-mono space-y-1.5 pr-2">
                <div>[Hệ thống] Đang chờ lệnh... Nhập từ khóa để bắt đầu.</div>
            </div>
        </div>

        <!-- Thanh công cụ phụ (Bộ lọc cục bộ) -->
        <div class="flex justify-between items-center px-2 hidden" id="toolbar">
            <span class="text-gray-600 font-medium" id="resultCount">Tìm thấy: 0 deal</span>
            <select id="localSort" onchange="renderProducts()" class="bg-white border border-gray-300 text-gray-700 py-1.5 px-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                <option value="default">Sắp xếp mặc định</option>
                <option value="priceAsc">Giá: Thấp đến Cao</option>
                <option value="priceDesc">Giá: Cao xuống Thấp</option>
            </select>
        </div>

        <!-- Lưới Hiển Thị Sản Phẩm -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5">
            <!-- Sản phẩm sẽ được render tại đây -->
        </div>

    </div>

    <!-- MODAL (CỬA SỔ) XEM ẢNH TO -->
    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black/95 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <button onclick="closeModal()" class="absolute top-4 right-4 md:top-8 md:right-8 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center text-2xl transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="modalImg" src="" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain border border-gray-800">
        <div class="absolute bottom-6 text-white/50 text-sm font-medium tracking-wider uppercase">
            Xianyu Manual Review
        </div>
    </div>

    <script>
        // Cấu hình API
        const API_KEY = "464b6ecde1mshef2e830fa1c29fep1d646ejsnd12195dcf2fa"; // Cố định
        const API_HOST = "xianyu-2taobao-goofish-api.p.rapidapi.com";
        const API_URL = "https://xianyu-2taobao-goofish-api.p.rapidapi.com/xianyu/search";
        
        // Từ khóa rủi ro
        const BLACKLIST = ["莆田", "纯原", "公司级", "高仿", "厂货", "尾单", "复刻", "定制", "假", "代购"];
        
        // Từ khóa mặc định
        const defaultKeywords = [
            "giày nike", "giày adidas", "giày newbalance", "giày mizuno", 
            "giày asics", "giày yeezy", "giày courtmz", "giày dropstep", 
            "giày ultraboost", "giày onitsuka tiger"
        ];

        // Biến toàn cục lưu trữ dữ liệu để phục vụ việc sắp xếp
        let currentProducts = [];

        // Tham chiếu DOM
        const keywordChipsDiv = document.getElementById('keywordChips');
        const keywordInput = document.getElementById('keywordInput');
        const logBox = document.getElementById('logBox');
        const productGrid = document.getElementById('productGrid');
        const startBtn = document.getElementById('startBtn');
        const statusBadge = document.getElementById('statusBadge');
        const toolbar = document.getElementById('toolbar');
        const resultCount = document.getElementById('resultCount');
        
        const imageModal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');

        // Render Chip Từ Khóa
        defaultKeywords.forEach(kw => {
            const btn = document.createElement('button');
            btn.className = "px-3 py-1.5 bg-white border border-gray-200 hover:border-blue-300 hover:bg-blue-50 hover:text-blue-700 text-sm font-medium text-gray-600 rounded-lg shadow-sm transition-all duration-200";
            btn.innerText = kw;
            btn.onclick = () => keywordInput.value = kw;
            keywordChipsDiv.appendChild(btn);
        });

        // Đóng/Mở Modal Xem ảnh
        function openModal(imgUrl) {
            modalImg.src = imgUrl;
            imageModal.classList.remove('hidden');
            // Thêm chút delay để CSS transition mượt hơn
            setTimeout(() => imageModal.classList.remove('opacity-0'), 10);
        }

        function closeModal() {
            imageModal.classList.add('opacity-0');
            setTimeout(() => imageModal.classList.add('hidden'), 300);
        }

        // Bấm ESC để đóng ảnh
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") closeModal();
        });

        // Hàm ghi Log
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            let color = "text-green-400";
            let icon = "";
            if(type === 'error') { color = "text-red-400"; icon = "❌ "; }
            if(type === 'warn') { color = "text-yellow-400"; icon = "⚠️ "; }
            if(type === 'success') { color = "text-cyan-400"; icon = "✅ "; }
            
            div.className = color;
            div.innerHTML = `<span class="opacity-70">[${time}]</span> ${icon}${message}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function isFake(title) {
            return BLACKLIST.some(word => title.includes(word));
        }

        // Hàm Render giao diện từ mảng dữ liệu (để hỗ trợ Sort)
        function renderProducts() {
            productGrid.innerHTML = "";
            const sortType = document.getElementById('localSort').value;
            
            // Clone mảng để không làm hỏng dữ liệu gốc
            let displayList = [...currentProducts];

            // Sắp xếp cục bộ theo giá
            if(sortType === 'priceAsc') displayList.sort((a, b) => a.price - b.price);
            if(sortType === 'priceDesc') displayList.sort((a, b) => b.price - a.price);

            resultCount.innerText = `Tìm thấy: ${displayList.length} deal ngon`;

            displayList.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-100 rounded-2xl overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col group transform hover:-translate-y-1";
                card.innerHTML = `
                    <!-- Khu vực ảnh có tính năng click xem to -->
                    <div class="h-48 md:h-56 overflow-hidden bg-gray-100 relative cursor-pointer" onclick="openModal('${item.imgUrl}')">
                        <img src="${item.imgUrl}" alt="Giày" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition duration-300 flex items-center justify-center">
                            <span class="opacity-0 group-hover:opacity-100 bg-white/90 text-gray-900 font-bold text-xs px-4 py-2 rounded-full shadow-lg backdrop-blur-sm transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">
                                <i class="fa-solid fa-magnifying-glass-plus mr-1"></i> Kiểm tra ảnh
                            </span>
                        </div>
                    </div>
                    
                    <!-- Thông tin -->
                    <div class="p-4 flex flex-col flex-grow">
                        <h4 class="text-sm font-medium text-gray-800 line-clamp-2 mb-3 leading-snug" title="${item.title}">${item.title}</h4>
                        <div class="mt-auto flex items-end justify-between">
                            <span class="text-xl font-extrabold text-red-600">¥${item.price}</span>
                        </div>
                        <a href="${item.itemUrl}" target="_blank" class="mt-4 flex items-center justify-center w-full bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 rounded-xl text-sm transition-colors shadow-sm">
                            <i class="fa-solid fa-cart-shopping mr-2"></i> Chốt đơn
                        </a>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Hàm chính chạy Scan
        async function startScan() {
            const keyword = keywordInput.value.trim();
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 999999;
            const pageNum = parseInt(document.getElementById('pageNum').value) || 1;

            if(!keyword) {
                log("Vui lòng nhập hoặc chọn từ khóa!", "error");
                return;
            }

            // Reset UI
            startBtn.disabled = true;
            startBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang quét...';
            statusBadge.innerText = "Đang kết nối API...";
            statusBadge.className = "text-xs px-3 py-1 bg-blue-900/50 border border-blue-500/50 rounded-full text-blue-400 font-mono shadow-[0_0_10px_rgba(59,130,246,0.2)]";
            productGrid.innerHTML = ""; 
            toolbar.classList.add('hidden');
            currentProducts = [];
            
            log(`-----------------------------------`);
            log(`Khởi chạy bot tìm kiếm: "${keyword}" (Trang ${pageNum})`);
            log(`Điều kiện lọc: ${minPrice}¥ - ${maxPrice}¥`);

            try {
                // Thêm tham số &sort=new để yêu cầu API lấy mới nhất (nếu API hỗ trợ)
                const url = `${API_URL}?keyword=${encodeURIComponent(keyword)}&page=${pageNum}&sort=new`;
                
                log(`Đang gửi tín hiệu... Vui lòng đợi 3-5 giây.`);
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'X-RapidAPI-Key': API_KEY,
                        'X-RapidAPI-Host': API_HOST
                    }
                });

                if (!response.ok) throw new Error(`Mã lỗi HTTP: ${response.status}`);
                
                const data = await response.json();
                let items = data.items || data.data?.items || data.result?.items || []; 
                
                log(`API phản hồi: Bắt được ${items.length} gói dữ liệu thô.`);

                let fakeCount = 0;
                let priceFilterCount = 0;

                // Xử lý dữ liệu thô vào mảng currentProducts
                items.forEach(item => {
                    const title = item.title || "";
                    const price = parseFloat(item.price || 0);
                    // Lấy ảnh độ phân giải cao nếu có
                    const imgUrl = item.pic_url || item.img || "https://via.placeholder.com/300?text=Loi+Anh";
                    const itemUrl = item.detail_url || item.url || "#";

                    if(isFake(title)) {
                        fakeCount++; return;
                    }
                    if(price < minPrice || price > maxPrice) {
                        priceFilterCount++; return;
                    }

                    // Đẩy dữ liệu sạch vào mảng
                    currentProducts.push({ title, price, imgUrl, itemUrl });
                });

                log(`Đã chặn đứng: ${fakeCount} sản phẩm có dấu hiệu Fake (莆田, 纯原,...)`, "warn");
                log(`Đã loại bỏ: ${priceFilterCount} sản phẩm ngoài khung giá.`);
                log(`Thành công! Trình bày ${currentProducts.length} deal lên giao diện.`, "success");
                
                statusBadge.innerText = "Hoàn tất";
                statusBadge.className = "text-xs px-3 py-1 bg-green-900/50 border border-green-500/50 rounded-full text-green-400 font-mono shadow-[0_0_10px_rgba(74,222,128,0.2)]";

                // Hiển thị toolbar bộ lọc và vẽ lưới sản phẩm
                if(currentProducts.length > 0) {
                    toolbar.classList.remove('hidden');
                    document.getElementById('localSort').value = 'default';
                    renderProducts();
                } else {
                    productGrid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">Không tìm thấy deal nào phù hợp ở trang này. Hãy thử tăng khoảng giá hoặc đổi từ khóa.</div>`;
                }

            } catch (error) {
                log(`Mất kết nối API: ${error.message}`, "error");
                statusBadge.innerText = "Lỗi kết nối";
                statusBadge.className = "text-xs px-3 py-1 bg-red-900/50 border border-red-500/50 rounded-full text-red-400 font-mono shadow-[0_0_10px_rgba(248,113,113,0.2)]";
            } finally {
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fa-solid fa-rocket mr-2"></i> Quét ngay';
            }
        }
    </script>
</body>
</html>
