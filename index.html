<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xianyu Sneaker Hunter Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #logBox::-webkit-scrollbar { width: 6px; }
        #logBox::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Control Panel -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">
                        ⚡ XIANYU SNEAKER HUNTER
                    </h1>
                    <p class="text-xs text-slate-400 mt-0.5">Phiên bản dò tìm cấu trúc (Debug Mode)</p>
                </div>
            </div>

            <!-- Gợi ý từ khóa -->
            <div class="mb-5">
                <div class="flex flex-wrap gap-2" id="keywordChips"></div>
            </div>

            <!-- Bộ lọc -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 items-end">
                <div class="lg:col-span-2">
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Từ khóa tìm kiếm</label>
                    <input type="text" id="keywordInput" class="w-full bg-slate-950 border border-slate-700 px-3.5 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none" value="Nike 鞋">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Giá thấp nhất</label>
                    <input type="number" id="minPrice" class="w-full bg-slate-950 border border-slate-700 px-3.5 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none" value="80">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Giá cao nhất</label>
                    <input type="number" id="maxPrice" class="w-full bg-slate-950 border border-slate-700 px-3.5 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none" value="650">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Trang (Page)</label>
                    <input type="number" id="pageNumber" min="1" class="w-full bg-slate-950 border border-slate-700 px-3.5 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none" value="1">
                </div>
                <div>
                    <button id="startBtn" onclick="startScan()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-extrabold py-2 px-4 rounded-xl text-sm transition">
                        🔍 Quét Deal Mới
                    </button>
                </div>
            </div>
        </div>

        <!-- Terminal hiển thị tiến trình -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
            <div id="logBox" class="h-48 overflow-y-auto text-xs font-mono space-y-1 text-slate-300">
                <div class="text-slate-500">[Sẵn sàng] Hãy bấm nút Quét...</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "464b6ecde1mshef2e830fa1c29fep1d646ejsnd12195dcf2fa";
        const API_HOST = "xianyu-2taobao-goofish-api.p.rapidapi.com";
        const API_URL = "https://xianyu-2taobao-goofish-api.p.rapidapi.com/xianyu/search/v1";

        const logBox = document.getElementById('logBox');
        const startBtn = document.getElementById('startBtn');

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            let color = "text-slate-300";
            if (type === 'error') color = "text-rose-400 font-bold"; // Chữ màu đỏ
            if (type === 'warn') color = "text-amber-400";
            
            div.className = color;
            div.innerHTML = `<span class="text-slate-600">[${time}]</span> ${message}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startScan() {
            const keyword = document.getElementById('keywordInput').value.trim();
            const page = document.getElementById('pageNumber').value || 1;

            startBtn.disabled = true;
            log(`Đang gọi API với từ khóa: "${keyword}" | Trang: ${page}`, "warn");

            try {
                const url = `${API_URL}?keyword=${encodeURIComponent(keyword)}&page=${page}`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'X-RapidAPI-Key': API_KEY,
                        'X-RapidAPI-Host': API_HOST,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`HTTP Lỗi ${response.status}`);

                const result = await response.json();
                
                // IN RA DỮ LIỆU GỐC ĐỂ BẮT BỆNH (Tối đa 400 ký tự để không bị dài quá)
                log("👇 COPY ĐOẠN CHỮ ĐỎ BÊN DƯỚI GỬI CHO TÔI 👇", "warn");
                let rawData = JSON.stringify(result).substring(0, 400);
                log(`RAW JSON: ${rawData}`, "error");
                log("👆 COPY ĐOẠN CHỮ ĐỎ Ở TRÊN GỬI CHO TÔI 👆", "warn");

            } catch (err) {
                log(`Lỗi kết nối: ${err.message}`, "error");
            } finally {
                startBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
