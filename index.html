<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xianyu Sneaker Hunter iOS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #logBox::-webkit-scrollbar { width: 3px; }
        #logBox::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 4px; }
        body { -webkit-text-size-adjust: 100%; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-3">

    <div class="max-w-7xl mx-auto space-y-3">
        <!-- Control Panel -->
        <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-lg font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">
                        ⚡ XIANYU iOS HUNTER
                    </h1>
                    <p class="text-[11px] text-slate-400">Tự động dịch Trung • 1¥ = 4,500đ • Chặn Full Size</p>
                </div>
                <div class="flex items-center gap-1.5">
                    <button onclick="toggleCurrency()" id="currencyBtn" class="text-[11px] bg-slate-800 text-amber-400 px-2.5 py-1.5 rounded-xl border border-slate-700 font-bold">
                        💱 VNĐ (ON)
                    </button>
                    <button onclick="clearMemory()" class="text-[11px] bg-rose-950/80 text-rose-300 px-2 py-1.5 rounded-xl border border-rose-800/50">
                        🗑️ Bot
                    </button>
                </div>
            </div>

            <!-- Ô nhập tiếng Việt & Dịch tiếng Trung -->
            <div class="space-y-2">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1">Nhập tiếng Việt (Ví dụ: Giày Nike 2hand)</label>
                    <input type="text" id="keywordInput" oninput="autoTranslate()" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Nhập từ khóa...">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[11px] font-semibold text-amber-400">Tiếng Trung (Tự động dịch)</label>
                        <button onclick="copyTranslated()" class="text-[10px] text-amber-300 bg-amber-500/20 px-2 py-0.5 rounded border border-amber-500/30">📋 Copy</button>
                    </div>
                    <input type="text" id="translatedInput" readonly class="w-full bg-slate-950 border border-amber-500/40 px-3 py-2 rounded-xl text-xs text-amber-300 font-mono outline-none" placeholder="Chờ nhập...">
                </div>
            </div>

            <!-- Bộ lọc giá & trang -->
            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Giá Min (¥)</label>
                    <input type="number" id="minPrice" class="w-full bg-slate-950 border border-slate-700 px-2 py-1.5 rounded-xl text-xs text-white text-center outline-none" value="80">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Giá Max (¥)</label>
                    <input type="number" id="maxPrice" class="w-full bg-slate-950 border border-slate-700 px-2 py-1.5 rounded-xl text-xs text-white text-center outline-none" value="650">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Trang (Page)</label>
                    <input type="number" id="pageNumber" min="1" class="w-full bg-slate-950 border border-slate-700 px-2 py-1.5 rounded-xl text-xs text-white text-center outline-none" value="1">
                </div>
            </div>

            <!-- Nút quét & Bot toggle -->
            <div class="space-y-2 pt-1">
                <label class="flex items-center justify-center space-x-2 bg-slate-950 border border-slate-700 py-2 rounded-xl cursor-pointer">
                    <input type="checkbox" id="onlyNewToggle" checked class="w-3.5 h-3.5 text-amber-500 rounded bg-slate-800 border-slate-600">
                    <span class="text-[11px] text-amber-400 font-bold">Chỉ Hiện Bài Mới (Bot Monitor)</span>
                </label>
                <button id="startBtn" onclick="startScan()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-extrabold py-2.5 rounded-xl text-sm shadow-lg active:scale-95 transition">
                    🔍 Quét Deal Xianyu
                </button>
            </div>
        </div>

        <!-- Terminal Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 shadow-md">
            <div id="logBox" class="h-20 overflow-y-auto text-[11px] font-mono space-y-1 text-slate-300">
                <div class="text-slate-500">[iOS Ready] Nhập từ khóa để bắt đầu...</div>
            </div>
        </div>

        <!-- Lưới kết quả -->
        <div>
            <div class="flex items-center justify-between mb-2 px-1">
                <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Kết Quả (<span id="countText">0</span>)</h2>
                <span class="text-[10px] text-slate-400">Bộ nhớ: <span id="memoryCount" class="text-amber-400 font-bold">0</span></span>
            </div>
            <div id="productGrid" class="grid grid-cols-2 gap-2"></div>
        </div>
    </div>

    <!-- Modal Xem Ảnh -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden flex items-center justify-center p-3">
        <div class="relative max-w-full w-full flex flex-col items-center">
            <button onclick="closeModal()" class="absolute -top-12 right-0 text-white text-lg font-bold bg-slate-800 px-3 py-1 rounded-full">✕ Đóng</button>
            <img id="modalImg" src="" alt="Zoom ảnh" class="max-w-full max-h-[75vh] object-contain rounded-lg border border-slate-700">
        </div>
    </div>

    <script>
        const API_KEY = "464b6ecde1mshef2e830fa1c29fep1d646ejsnd12195dcf2fa";
        const API_HOST = "xianyu-2taobao-goofish-api.p.rapidapi.com";
        const API_URL = "https://xianyu-2taobao-goofish-api.p.rapidapi.com/xianyu/search/v1";

        let isVND = true;
        let seenItems = JSON.parse(localStorage.getItem('xianyuMemoryIOS')) || [];
        document.getElementById('memoryCount').innerText = seenItems.length;

        function clearMemory() {
            if(confirm("Xóa bộ nhớ Bot?")) {
                seenItems = [];
                localStorage.setItem('xianyuMemoryIOS', JSON.stringify(seenItems));
                document.getElementById('memoryCount').innerText = 0;
                log("Đã reset bộ nhớ!", "success");
            }
        }

        function toggleCurrency() {
            isVND = !isVND;
            const btn = document.getElementById('currencyBtn');
            btn.innerText = isVND ? "💱 VNĐ (ON)" : "💱 VNĐ (OFF)";
            btn.className = isVND ? "text-[11px] bg-slate-800 text-amber-400 px-2.5 py-1.5 rounded-xl border border-slate-700 font-bold" : "text-[11px] bg-slate-800 text-slate-400 px-2.5 py-1.5 rounded-xl border border-slate-700";
            if(window.lastItemsData) renderProducts(window.lastItemsData);
        }

        const dict = {
            "giày": "鞋", "nike": "Nike", "adidas": "Adidas", "new balance": "New Balance", 
            "nb": "NB", "mizuno": "美津浓", "asics": "亚瑟士", "yeezy": "椰子", 
            "onitsuka tiger": "鬼冢虎", "cũ": "二手", "2hand": "二手", "thanh lý": "个人闲置",
            "chính hãng": "正品", "nam": "男", "nữ": "女"
        };

        function autoTranslate() {
            let input = document.getElementById('keywordInput').value.toLowerCase().trim();
            if(!input) { document.getElementById('translatedInput').value = ""; return; }
            let translated = input;
            for (let [vi, cn] of Object.entries(dict)) {
                let regex = new RegExp(vi, 'gi');
                translated = translated.replace(regex, cn);
            }
            document.getElementById('translatedInput').value = translated;
        }

        function copyTranslated() {
            const copyText = document.getElementById('translatedInput');
            if(!copyText.value) return alert("Chưa có chữ!");
            navigator.clipboard.writeText(copyText.value);
            alert("Đã copy: " + copyText.value);
        }

        function copyAppUrl(itemId) {
            let schemeUrl = `fleamarket://item?id=${itemId}`;
            navigator.clipboard.writeText(schemeUrl);
            alert("Đã copy Link App! Hãy mở app Xianyu lên, ứng dụng sẽ tự động nhận diện sản phẩm.");
        }

        const BLACKLIST = [
            "全码", "齐码", "多码", "断码", "情侣款", "鞋码齐全", "男女鞋", "各种码", "都有",
            "全新", "代购", "专柜", "实体店", "清仓", "代理", "一件代发", "批发", 
            "莆田", "纯原", "公司级", "高仿", "厂货", "尾单", "复刻", "定制", "假", 
            "顶级", "超a", "过验", "1:1", "原单", "原厂", "原盒", "支持验货", "放店", 
            "微商", "店主", "进货渠道", "正品保真"
        ];

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            let color = "text-slate-300";
            if (type === 'error') color = "text-rose-400 font-semibold";
            if (type === 'warn') color = "text-amber-400";
            if (type === 'success') color = "text-emerald-400 font-semibold";
            div.className = color;
            div.innerHTML = `<span class="text-slate-600">[${time}]</span> ${message}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function openImage(url) { modalImg.src = url; imageModal.classList.remove('hidden'); }
        function closeModal() { imageModal.classList.add('hidden'); modalImg.src = ""; }
        imageModal.onclick = (e) => { if (e.target === imageModal) closeModal(); };

        function checkBlacklist(text) {
            if (!text) return null;
            for (let word of BLACKLIST) { if (text.includes(word)) return word; }
            return null;
        }

        async function startScan() {
            const keyword = document.getElementById('translatedInput').value.trim() || document.getElementById('keywordInput').value.trim();
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 999999;
            const page = parseInt(document.getElementById('pageNumber').value) || 1;

            if (!keyword) return log("Vui lòng nhập từ khóa!", "error");

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50');
            document.getElementById('productGrid').innerHTML = "";
            document.getElementById('countText').innerText = "0";

            log(`Đang quét: "${keyword}" | Trang ${page}`, "warn");

            try {
                const url = `${API_URL}?keyword=${encodeURIComponent(keyword)}&page=${page}`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-RapidAPI-Key': API_KEY, 'X-RapidAPI-Host': API_HOST, 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP Lỗi ${response.status}`);
                const result = await response.json();
                
                let items = [];
                if (result.data && Array.isArray(result.data.item)) items = result.data.item;
                else if (result.data && Array.isArray(result.data.items)) items = result.data.items;
                else if (result.items && Array.isArray(result.items)) items = result.items;
                else if (Array.isArray(result)) items = result;

                if (items.length === 0) {
                    log("Không tìm thấy kết quả.", "warn");
                    startBtn.disabled = false;
                    startBtn.classList.remove('opacity-50');
                    return;
                }

                window.lastItemsData = items;
                renderProducts(items);

            } catch (err) {
                log(`Lỗi: ${err.message}`, "error");
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50');
            }
        }

        function renderProducts(items) {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = "";
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 999999;
            const isOnlyNew = document.getElementById('onlyNewToggle').checked;

            let validCount = 0, fakeCount = 0, oldSkipCount = 0;
            let newItemsFound = [];

            items.forEach(item => {
                const title = item.title || item.desc || "";
                const priceRMB = parseFloat(item.price || 0);
                const itemId = item.item_id || item.id || ""; 

                const isNewDeal = !seenItems.includes(itemId);
                if (isOnlyNew && !isNewDeal) { oldSkipCount++; return; }
                if (checkBlacklist(title)) { fakeCount++; return; }
                if (priceRMB < minPrice || priceRMB > maxPrice) return;

                validCount++;
                if (isNewDeal) newItemsFound.push(itemId);

                const imgUrl = item.pic_url || item.pic || item.imageUrl || "https://placehold.co/400x400/1e293b/white?text=No+Image";
                const webUrl = item.detail_url || item.item_url || (itemId ? `https://2.taobao.com/item.htm?id=${itemId}` : "#");

                let displayPriceText = `¥${priceRMB}`;
                if (isVND) {
                    let priceVND = priceRMB * 4500;
                    displayPriceText = priceVND.toLocaleString('vi-VN') + ' đ';
                }

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col justify-between shadow relative";
                card.innerHTML = `
                    ${isNewDeal ? '<div class="absolute top-1.5 right-1.5 z-10 bg-rose-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded-full shadow animate-pulse">🔥 MỚI</div>' : ''}
                    <div>
                        <div class="relative w-full aspect-square bg-slate-950 overflow-hidden">
                            <img src="${imgUrl}" alt="Sneaker" class="w-full h-full object-cover" onclick="openImage('${imgUrl}')">
                        </div>
                        <div class="p-2">
                            <h3 class="text-[11px] text-slate-200 line-clamp-2 leading-tight font-medium" title="${title}">${title}</h3>
                        </div>
                    </div>
                    <div class="p-2 pt-1 border-t border-slate-800 space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-amber-400 font-mono">${displayPriceText}</span>
                            <a href="${webUrl}" target="_blank" class="text-[10px] text-slate-400 underline">Web ↗</a>
                        </div>
                        <div class="grid grid-cols-2 gap-1">
                            <a href="fleamarket://item?id=${itemId}" class="bg-amber-400 hover:bg-amber-300 text-slate-950 text-[10px] font-bold py-1 rounded text-center active:scale-95">Mở App</a>
                            <button onclick="copyAppUrl('${itemId}')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-[10px] font-bold py-1 rounded text-center active:scale-95">📋 Copy Link</button>
                        </div>
                    </div>
                `;
                productGrid.appendChild(card);
            });

            if (newItemsFound.length > 0) {
                seenItems = [...newItemsFound, ...seenItems].slice(0, 2000);
                localStorage.setItem('xianyuMemoryIOS', JSON.stringify(seenItems));
                document.getElementById('memoryCount').innerText = seenItems.length;
            }

            document.getElementById('countText').innerText = validCount;
            log(`Lọc xong: Chặn ${fakeCount} rác | Hiện ${validCount} deal!`, "success");

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50');
        }
    </script>
</body>
</html>
